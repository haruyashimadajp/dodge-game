<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodge Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div class="stat"><span class="label">Time</span><span class="value" id="score">0.0s</span></div>
      <div class="stat"><span class="label">Best</span><span class="value" id="best">0.0s</span></div>
      <div class="stat"><span class="label">Lives</span><span class="value" id="livesHud">3</span></div>
      <span class="hint">← → / A D &nbsp;·&nbsp; ↑ / W / Space jump &nbsp;·&nbsp; Esc pause</span>
    </div>

    <div class="stage">
      <canvas id="game" width="800" height="750"></canvas>

      <!-- Pause toggle (works with click & tap) -->
      <button class="pause-btn hidden" id="pauseBtn" aria-label="pause">II</button>

      <!-- Title / result screen (the canvas behind it is animated) -->
      <div class="overlay title-screen" id="overlay">
        <div class="title-box">
          <div class="kicker">RHYTHM · DODGE · SURVIVE</div>
          <h1 class="logo" id="ovTitle" data-text="DODGE">DODGE</h1>
          <!-- Song select: ◀ ▶ (or ← → keys) switch songs and play a preview -->
          <div class="song-select">
            <button class="song-arrow" id="songPrev" aria-label="前の曲">◀</button>
            <div class="song-info">
              <div class="song-tag"><span class="note">♪</span> <span id="songName">the EmpErroR</span></div>
              <div class="song-meta" id="songMeta"></div>
            </div>
            <button class="song-arrow" id="songNext" aria-label="次の曲">▶</button>
          </div>
          <p class="ov-sub" id="ovSub"></p>

          <div class="result-box" id="resultBox">
            <div class="res"><span>TIME</span><b id="resTime">0.0s</b></div>
            <div class="res"><span>BEST</span><b id="resBest">0.0s</b></div>
            <div class="res"><span>HITS</span><b id="resHits">0</b></div>
          </div>

          <button id="startBtn" class="start-btn">START</button>
          <div class="title-links">
            <button id="settingsToggle" class="link-btn">⚙ 設定</button>
            <button id="toTitleBtn2" class="link-btn result-only">タイトルへ</button>
            <span class="best-tag title-only">BEST <b id="titleBest">0.0s</b></span>
          </div>
          <p class="press-hint title-only">Enter / Space でスタート · ← → で曲を選ぶ</p>
        </div>
      </div>

      <!-- Pause screen -->
      <div class="overlay hidden" id="pauseOverlay">
        <h1>Paused</h1>
        <div class="btn-row">
          <button id="resumeBtn">再開 (Esc)</button>
          <button id="pauseSettingsBtn" class="btn-sub">⚙ 設定</button>
          <button id="restartBtn" class="btn-sub">やり直す</button>
          <button id="toTitleBtn" class="btn-sub">タイトルへ</button>
        </div>
      </div>

    </div>

    <!-- On-screen touch controls (shown only in mobile mode, while playing).
         The move zone is either a big left/right pad or an analog stick. -->
    <div class="touch hidden" id="touchControls">
      <div class="move-zone" id="moveZone">
        <div class="lr-pad">
          <div class="lr left" id="lrLeft">◀</div>
          <div class="lr right" id="lrRight">▶</div>
        </div>
        <div class="stick-base" id="stickBase"><div class="stick-knob" id="stickKnob"></div></div>
      </div>
      <div class="tbtn jump" id="jumpBtn" aria-label="jump">JUMP</div>
    </div>
  </div>

  <!-- Settings: its own full-screen page. The header (with ✕) stays put
       while the body scrolls, so the close button never disappears. -->
  <div class="modal hidden" id="settingsModal" role="dialog" aria-label="設定">
    <div class="modal-card">
      <div class="modal-head">
        <h2>設定</h2>
        <button class="modal-x" id="settingsClose" aria-label="閉じる">✕</button>
      </div>
      <div class="modal-body" id="mountSettings"></div>
      <div class="modal-foot"><button class="done-btn" id="settingsDone">閉じる</button></div>
    </div>
  </div>

  <!-- Single settings panel, moved between the title and pause screens -->
  <template id="settingsTemplate">
    <div class="settings-panel" id="settingsPanel">

      <div class="settings-group" id="controlModeGroup">
        <div class="group-title">操作方法</div>
        <div class="seg">
          <button class="seg-btn" data-mode="pc">パソコン操作</button>
          <button class="seg-btn" data-mode="mobile">スマホ操作</button>
        </div>
        <div class="group-title">移動の操作（スマホ操作時）</div>
        <div class="seg">
          <button class="seg-btn" data-ctl="buttons">◀ ▶ ボタン</button>
          <button class="seg-btn" data-ctl="stick">スティック</button>
        </div>
        <div class="group-title">移動の操作の位置（スマホ操作時）</div>
        <div class="seg">
          <button class="seg-btn" data-dpad="left">左</button>
          <button class="seg-btn" data-dpad="right">右</button>
        </div>
      </div>

      <div class="settings-group">
        <div class="group-title">設定</div>
        <label class="setting">
          <span class="setting-label">音量 <b id="volVal"></b></span>
          <input type="range" id="volume" min="0" max="100" step="1">
        </label>
        <label class="setting">
          <span class="setting-label">画面演出（ゆれ・ズーム・光） <b id="fxVal"></b></span>
          <input type="range" id="fxAmount" min="0" max="100" step="5">
        </label>
        <div class="setting">
          <span class="setting-label">画質（重いときは下げる） <b id="gfxVal"></b></span>
          <div class="seg seg-4">
            <button class="seg-btn" data-gfx="auto">自動</button>
            <button class="seg-btn" data-gfx="2">高</button>
            <button class="seg-btn" data-gfx="1">中</button>
            <button class="seg-btn" data-gfx="0">低</button>
          </div>
        </div>
      </div>

      <details class="settings-group debug">
        <summary class="group-title">デバッグ設定（ゲームに影響）</summary>
        <label class="setting">
          <span class="setting-label">移動速度 <b id="moveVal"></b></span>
          <input type="range" id="moveSpeed" min="120" max="500" step="10">
        </label>
        <label class="setting">
          <span class="setting-label">ジャンプ力 <b id="jumpVal"></b></span>
          <input type="range" id="jumpVel" min="500" max="1100" step="10">
        </label>
        <label class="setting">
          <span class="setting-label">残機 <b id="livesVal"></b></span>
          <input type="range" id="lives" min="1" max="9" step="1">
        </label>
        <label class="setting">
          <span class="setting-label">弾の速さ <b id="bulletVal"></b></span>
          <input type="range" id="bulletSpeed" min="30" max="200" step="5">
        </label>
        <div class="setting">
          <span class="setting-label">移動の仕方</span>
          <div class="seg">
            <button class="seg-btn" data-move="slide">滑る</button>
            <button class="seg-btn" data-move="snap">滑らない</button>
          </div>
        </div>
      </details>

    </div>
  </template>

  <!-- Order matters: song data → engine → songs (they call addSong) → visuals -->
  <script src="songs/firststep-env.js"></script>
  <script src="songs/firststep-score.js"></script>
  <script src="songs/emperror-env.js"></script>
  <script src="songs/unknown-env.js"></script>
  <script src="songs/moratorium-env.js"></script>
  <script src="songs/moratorium-score.js"></script>
  <script src="songs/segment-env.js"></script>
  <script src="songs/segment-score.js"></script>
  <script src="songs/vertigo-env.js"></script>
  <script src="songs/vertigo-score.js"></script>
  <script src="songs/extremeex-env.js"></script>
  <script src="songs/extremeex-score.js"></script>
  <script src="songs/malware-env.js"></script>
  <script src="songs/malware-score.js"></script>
  <script src="game.js"></script>
  <script src="songs/firststep.js"></script>
  <script src="songs/emperror.js"></script>
  <script src="songs/unknown.js"></script>
  <script src="songs/moratorium.js"></script>
  <script src="songs/segment.js"></script>
  <script src="songs/vertigo.js"></script>
  <script src="songs/extremeex.js"></script>
  <script src="songs/malware.js"></script>
  <script src="visuals.js"></script>
  <script src="visuals-night.js"></script>
  <script src="visuals-dusk.js"></script>
  <script src="visuals-glass.js"></script>
  <script src="visuals-gyro.js"></script>
  <script src="visuals-ex.js"></script>
  <script src="visuals-virus.js"></script>
  <script src="visuals-day.js"></script>
</body>
</html>
